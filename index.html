<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./CSS/style.css">
    <meta name="description" content="Bouncing DVD logo effect in pure JS and SVG.">
    <meta name="author" content="Bereket Kinfe">
    <title>Double DVD Logo Bouncing Effect</title>
</head>
<body>
    <div class="container" id="container">
        <!-- DVD SVG Logo bouncing will be injected here -->
        <div id="info-widget" class="info-widget">
            <h3>Live Stats</h3>
            <div class="stat-row">
                <span>Logo 1:</span>
                <span id="pos-logo1">x: 0, y: 0</span>
            </div>
            <div class="stat-row">
                <span>Logo 2:</span>
                <span id="pos-logo2">x: 0, y: 0</span>
            </div>
            <div class="stat-row">
                <span>Collision Prob:</span>
                <span id="collision-prob">0%</span>
            </div>
        </div>
    </div>

    <script type="module" src="./index.js"></script>
</body>
</html>
